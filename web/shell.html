<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Proyecto 1942 | Arcade en el navegador</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080b12; color: #f4f5f7; font-family: system-ui, -apple-system, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
    .game { width: min(600px, 100%); display: flex; justify-content: center; }
    canvas { display: block; width: 100%; max-width: 600px; height: auto; aspect-ratio: 3 / 4; background: #000; image-rendering: auto; outline: none; }
    .toolbar { width: min(600px, 100%); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    #status { font-size: 12px; color: #a9b0c0; }
    button { border: 1px solid #556070; border-radius: 6px; background: #182030; color: white; padding: 8px 12px; cursor: pointer; }
    button:hover { background: #273449; }
    #progress { width: min(600px, 100%); height: 4px; accent-color: #64e393; }
    #progress[hidden] { display: none; }
    .game:fullscreen { width: 100%; height: 100%; align-items: center; background: black; }
    .game:fullscreen canvas { width: auto; height: min(100%, 100vh); max-width: 100%; }
  </style>
</head>
<body>
  <main>
    <div id="game" class="game">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    </div>
    <progress id="progress" max="100" value="0" hidden></progress>
    <div class="toolbar">
      <span id="status" role="status">Cargando juego…</span>
      <button id="fullscreen" type="button">Pantalla completa</button>
    </div>
  </main>
  <script>
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var canvasElement = document.getElementById('canvas');
    var Module = {
      preRun: [],
      postRun: [],
      canvas: canvasElement,
      setStatus: function(text) {
        statusElement.textContent = text || '';
        var match = text && text.match(/([^(]+)\((\d+(?:\.\d+)?)\/(\d+)\)/);
        if (match) {
          progressElement.hidden = false;
          progressElement.value = parseFloat(match[2]) * 100;
          progressElement.max = parseFloat(match[3]) * 100;
        } else {
          progressElement.hidden = true;
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        this.setStatus(left ? 'Preparando recursos (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
      },
      print: function() {},
      printErr: function(text) { console.error(text); }
    };
    window.addEventListener('error', function(event) {
      statusElement.textContent = 'Error al cargar el juego. Revisá la consola del navegador.';
      console.error(event.error || event.message);
    });
    document.getElementById('fullscreen').addEventListener('click', function() {
      var game = document.getElementById('game');
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (game.requestFullscreen) {
        game.requestFullscreen().then(function() { canvasElement.focus(); }).catch(console.error);
      }
    });
    canvasElement.addEventListener('click', function() { canvasElement.focus(); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
